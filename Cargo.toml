[workspace]
members = [".", "migration"]

[package]
name = "axum_project"
version = "0.1.0"
edition = "2024"

[dependencies]
# Our own migration crate (lives in ./migration)
migration = { path = "migration" }

# Web
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
scalar_api_reference = { version = "0.1.0", features = ["axum"] }

# Database
sea-orm = { version = "2.0.4", features = ["sqlx-sqlite", "runtime-tokio", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Errors
thiserror = "2.0"
anyhow = "1.0"

# Config & logging
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
